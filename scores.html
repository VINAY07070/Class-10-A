<!DOCTYPE html>
<html lang="en">
<head>  <script>
    (function () {
      try {
        var t = localStorage.getItem('aia_theme');
        if (t && ['glass','luxury','simple','midnight','neon','sunset','ocean','royal'].indexOf(t) !== -1) {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    })();
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIA Class 10-A Hub — Scores</title>
  <meta name="description" content="Class 10-A test scores with analytics and percentage bars.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/stickmen.css">
  <link rel="stylesheet" href="css/themes.css">

</head>
<body>
  <div id="navbar-placeholder"></div>
  <div id="gate-placeholder"></div>

  <header class="page-header">
    <div class="container">
      <div class="page-icon"><i class="fa-solid fa-chart-column"></i></div>
      <h1 class="heading-lg text-gold reveal">Scores</h1>
      <p class="reveal reveal-delay-1">Test results at a glance. Percentages with live animated bars.</p>
      <div style="margin-top:22px">
        <button class="btn btn-secondary btn-sm reveal reveal-delay-2" onclick="window.print()"><i class="fa-solid fa-print"></i> Print Report</button>
      </div>
    </div>
  </header>

  <section class="section" style="padding-top:0">
    <div class="container">
      <div class="section-head" data-reveal>
        <span class="eyebrow">Analytics</span>
        <h2 class="heading-md">Performance Overview</h2>
      </div>
      <div class="analytics-grid" id="analyticsGrid"></div>

      <div class="glass-card grad-border" style="margin-bottom:28px" data-reveal>
        <h3 class="heading-sm" style="margin-bottom:18px"><i class="fa-solid fa-chart-pie" style="color:var(--gold)"></i> Grade Distribution</h3>
        <div class="grade-dist" id="gradeDist"></div>
      </div>

      <div class="scores-table-wrap reveal">
        <table class="scores-table" id="scoresTable">
          <thead>
            <tr>
              <th>Student</th>
              <th>Subject</th>
              <th>Test</th>
              <th>Score / Max</th>
              <th>Percentage</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="scoresBody"></tbody>
        </table>
      </div>
      <div id="scoresEmpty" class="empty-state" style="display:none">
        <div class="empty-icon">📭</div>
        <p>No scores recorded yet.</p>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="data/seed.js"></script>
  <script src="js/data.js"></script>
  <script src="js/stickmen.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/scores.js"></script>
</body>
</html>
