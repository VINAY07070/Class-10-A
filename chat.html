<!DOCTYPE html>
<html lang="en">
<head>  <script>
    (function () {
      try {
        var t = localStorage.getItem('aia_theme');
        if (t && ['glass','luxury','simple','midnight','neon','sunset','ocean','royal'].indexOf(t) !== -1) {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    })();
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#070b16">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>AIA Class 10-A Hub — Student Chat</title>
  <meta name="description" content="Class 10-A student chat — log in and talk with your classmates.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/stickmen.css">
  <link rel="stylesheet" href="css/themes.css">

  <script src="perf.js"></script>
</head>
<body>
  <div id="navbar-placeholder"></div>

  <header class="page-header">
    <div class="container">
      <div class="page-icon"><i class="fa-solid fa-message"></i></div>
      <h1 class="heading-lg text-gold reveal">Student Chat</h1>
      <p class="reveal reveal-delay-1">Class 10-A chatroom. Login with your student account — your name shows, that's all.</p>
    </div>
  </header>

  <section class="section" style="padding-top:0">
    <div class="container">

      <!-- Chat login -->
      <div class="chat-login-box glass-card grad-border reveal" id="chatLoginBox">
        <div style="text-align:center;font-size:2.6rem;margin-bottom:10px"><i class="fa-solid fa-comments" style="color:var(--gold)"></i></div>
        <h3 class="heading-md" style="text-align:center">Login to chat</h3>
        <p class="text-muted" style="text-align:center;font-size:.85rem;margin:8px 0 20px">Use the username &amp; password the admin gave you.</p>
        <div class="login-input-group" style="max-width:420px;margin:0 auto">
          <input type="text" id="chatUser" placeholder="Username" autocomplete="off">
          <input type="password" id="chatPass" placeholder="Password" autocomplete="off" style="margin-top:10px">
          <button class="btn btn-primary" id="chatLoginBtn" style="width:100%;margin-top:14px"><i class="fa-solid fa-right-to-bracket"></i> Enter Chat</button>
        </div>
        <div id="chatLoginError" class="login-error" style="text-align:center"></div>
      </div>

      <!-- Chat app -->
      <div class="chat-app glass-card" id="chatApp" style="display:none">
        <div class="chat-app-header">
          <div>
            <strong id="chatLoggedAs">—</strong>
            <span class="chat-online-dot"></span> <span class="text-muted" style="font-size:.8rem">Class 10-A room</span>
          </div>
          <div class="chat-app-actions">
            <button class="btn btn-secondary btn-sm" id="adminViewToggle" style="display:none"><i class="fa-solid fa-eye"></i> <span>Admin view</span></button>
            <button class="btn btn-secondary btn-sm" id="clearMyChatBtn"><i class="fa-solid fa-broom"></i> Clear my chat</button>
            <button class="btn btn-secondary btn-sm" id="chatLogoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
          </div>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-area">
          <input type="file" id="chatFileInput" multiple style="display:none">
          <button class="chat-attach-btn" id="chatAttachBtn" aria-label="Attach a file" title="Send a photo, PDF or any file"><i class="fa-solid fa-paperclip"></i></button>
          <input type="text" class="chat-input" id="chatInput" placeholder="Type a message..." autocomplete="off" maxlength="500">
          <button class="chat-send-btn" id="chatSendBtn" aria-label="Send"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
      </div>

    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="data/seed.js"></script>
  <script src="js/data.js"></script>
  <script src="js/stickmen.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
