<!DOCTYPE html>
<html lang="en">
<head>  <script>
    (function () {
      try {
        var t = localStorage.getItem('aia_theme') || 'luxury';
        if (['glass','luxury','simple','midnight','neon','sunset','ocean','royal'].indexOf(t) === -1) t = 'luxury';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#070b16">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>AIA Class 10-A Hub — Class AI</title>
  <meta name="description" content="Chat with Class AI — your smart 10-A study companion.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/stickmen.css">
  <link rel="stylesheet" href="css/themes.css">

  <script src="perf.js"></script>
  <link rel="stylesheet" href="css/notify.css">
</head>
<body>
  <div id="navbar-placeholder"></div>
  <div id="gate-placeholder"></div>

  <header class="page-header">
    <div class="container">
      <div class="page-icon"><i class="fa-solid fa-robot"></i></div>
      <h1 class="heading-lg text-gold reveal">Class AI</h1>
      <p class="reveal reveal-delay-1">Your smart 10-A study companion. Ask doubts, homework questions, or quiz yourself!</p>
    </div>
  </header>

  <section class="section" style="padding-top:0">
    <div class="container">
      <div class="chat-container" data-reveal>
        <div class="chat-mode-switcher" id="modeSwitcher">
          <button class="chat-mode-chip active" data-mode="study"><i class="fa-solid fa-book-open"></i> Study Bot</button>
          <button class="chat-mode-chip" data-mode="homework"><i class="fa-solid fa-pen-to-square"></i> Homework Bot</button>
          <button class="chat-mode-chip" data-mode="quiz"><i class="fa-solid fa-brain"></i> Quiz Bot</button>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="chat-input-area">
          <input type="text" class="chat-input" id="chatInput" placeholder="Ask Class AI anything..." autocomplete="off">
          <button class="chat-send-btn" id="sendBtn" aria-label="Send"><i class="fa-solid fa-paper-plane"></i></button>
        </div>

        <div class="suggested-chips" id="suggestedChips"></div>
        <button class="btn btn-secondary btn-sm clear-chat-btn" id="clearBtn"><i class="fa-solid fa-broom"></i> Clear Chat</button>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="data/seed.js"></script>
  <script src="js/data.js"></script>
  <script src="js/aiapi.js"></script>
  <script src="js/stickmen.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/notify.js"></script>
  <script src="js/ai.js"></script>
</body>
</html>
